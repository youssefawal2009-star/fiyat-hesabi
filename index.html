<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050504">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiyat Hesabı">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yeni Dekor · Fiyat Hesabı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#f5efe6; --card:#fffdf9; --ink:#2b2118; --muted:#8a7b6c; --line:#e7ddcf;
    --gold:#b8862b; --gold-soft:#f3e6c8; --warn:#c2410c; --warn-soft:#fdeee4; --ok:#15803d; --ok-soft:#e5f4ea;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none;min-width:0}
  input:focus{border-color:var(--gold)}

  /* çizili simgeler */
  .ic{display:block;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .ic .f{fill:var(--tbg,var(--card))}
  .ic .d{fill:var(--ink);stroke:none}
  .ic .t{stroke-width:1.2}
  .emo{display:block;line-height:1;text-align:center}

  header{background:#050504;padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;text-align:center}
  header img{display:block;height:112px;width:auto;margin:0 auto}
  .eye{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(184,134,43,.12);display:flex;align-items:center;justify-content:center}
  .eye:active{transform:scale(.92)}
  .eye svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  body.gizli .eye{background:var(--gold)}
  body.gizli .eye svg{stroke:#050504}
  /* gizli mod: yazılan fiyatlar nokta olur, toplam görünmez */
  body.gizli .pr input{-webkit-text-security:disc}
  body.gizli .ltot{filter:blur(6px)}

  main{padding:4px 14px 130px;max-width:560px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 4px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .card + .card{margin-top:10px}
  .hint{color:var(--muted);font-size:14px;margin:4px 4px 10px}
  .empty{color:var(--muted);text-align:center;margin:10px 0}

  /* ürün simgeleri */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{--tbg:var(--card);position:relative;background:var(--tbg);border:1.5px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:100px;overflow:hidden}
  .tile.on{--tbg:var(--gold-soft);border-color:var(--gold)}
  .tmain{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;transition:transform .08s}
  .tmain:active{transform:scale(.92)}
  .tile .ic{width:64px;height:48px}
  .tile .nm{font-size:13px;font-weight:600;text-align:center;line-height:1.15}
  .tile .nm small{font-size:11px;font-weight:500;color:var(--muted)}
  /* seçili simgenin altında − adet + */
  .tstep{display:flex;align-items:center;border-top:1.5px solid var(--line);background:var(--card)}
  .tile.on .tstep{border-top-color:var(--gold)}
  .tstep button:disabled{opacity:.25}
  .tile:not(.on) .tstep b{color:var(--muted)}
  .tstep button{width:40px;height:36px;font-size:22px;font-weight:700;color:var(--ink)}
  .tstep button:active{background:var(--gold-soft)}
  .tstep b{flex:1;text-align:center;font-size:15px}
  .badge{position:absolute;top:6px;right:6px;background:var(--ink);color:#fff;border-radius:999px;min-width:24px;height:24px;padding:0 7px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* sepet */
  .line{padding:10px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom-color:transparent}
  .lt{display:flex;align-items:center;gap:8px}
  /* tut-sürükle tutamacı */
  .grip{flex:none;width:30px;height:38px;margin-right:-6px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border-radius:8px}
  .grip svg{width:12px;height:20px;fill:var(--muted)}
  .grip:active{background:var(--gold-soft)}
  .line{position:relative;background:var(--card)}
  .line.shifting{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
  .line.dragging{z-index:5;border-radius:14px;border-bottom-color:transparent;box-shadow:0 0 0 2px var(--gold),0 16px 34px rgba(43,33,24,.28);background:var(--gold-soft);transition:box-shadow .2s}
  .line.dropping{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;box-shadow:0 0 0 2px var(--gold),0 2px 6px rgba(43,33,24,.12)}
  .card.cart{padding:2px 12px}
  body.dragmode{user-select:none;-webkit-user-select:none}
  .lt .ic{width:40px;height:30px}
  .lt .emo{font-size:24px;width:30px}
  .lt .nm{flex:1;font-weight:700}
  .lt .own{font-weight:500;color:var(--muted);font-size:14px}
  .x{flex:none;width:34px;height:34px;margin-left:-8px;border-radius:10px;color:var(--muted);font-size:16px}
  .x:active{background:var(--line)}
  .lb{display:flex;gap:10px;margin-top:8px;align-items:center}
  .step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
  .step button{width:42px;height:44px;font-size:22px;font-weight:700}
  .step button:active{background:var(--line)}
  .step b{min-width:28px;text-align:center}
  .pr,.tlw{flex:1;position:relative}
  .pr input,.tlw input{padding-right:38px;text-align:right;font-weight:700}
  .pr span,.tlw span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .pr.miss input{border-color:var(--warn);background:var(--warn-soft)}
  .pr.miss input::placeholder{color:var(--warn);font-weight:700}
  .ltot{text-align:right;color:var(--muted);font-size:14px;margin-top:6px}


  .ver{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 0;opacity:.7}
  .clear{display:block;margin:12px auto 0;color:var(--muted);font-size:14px;padding:8px 12px}

  /* en altta sadece toplam */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,var(--bg) 35%)}
  #bar .barin{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:18px;padding:10px 10px 10px 18px;box-shadow:0 8px 24px rgba(43,33,24,.25)}
  #bar .tot{display:flex;align-items:baseline;gap:10px}
  #bar .tot span{font-weight:700;color:#cdbfa9}
  #bar b{font-size:24px;font-weight:800}
  body.typing #bar{display:none}

  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-140%);transition:transform .25s;z-index:30;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
  #toast.show{transform:translate(-50%,0)}
  #toast .undo{margin-left:10px;color:var(--gold);font-weight:800;padding:4px 6px}
</style>
</head>
<body>
<header><img src="logo.png" alt="Yeni Dekor Mobilya"></header>
<main id="app"></main>
<div id="bar"><div class="barin"><span class="tot"><span>Toplam</span><b id="bt">0 ₺</b></span><button class="eye" id="eye" data-act="eye" aria-label="Fiyatları gizle / göster"><svg viewBox="0 0 24 24"></svg></button></div></div>
<div id="toast"></div>

<script>
/* ---------- çizili mobilya simgeleri ---------- */
const ICONS = {
  // Hepsi önden görünüş, aynı çizgi kalınlığı, aynı zemin çizgisi (y=42)
  koltuk: '<rect class="f" x="7.5" y="16" width="49" height="11" rx="2"/><rect class="f" x="6" y="22" width="3.2" height="14" rx="1.3"/><rect class="f" x="54.8" y="22" width="3.2" height="14" rx="1.3"/><rect class="f" x="9.2" y="27" width="45.6" height="9" rx="1"/><path d="M24.40 27v9M39.60 27v9"/><path d="M7.6 36V42M56.4 36V42"/>',
  yatakodasi: '<rect x="4" y="29" width="10" height="10" rx="1.2"/><path d="M4 34h10M7.5 32h3M5.5 39v3M12.5 39v3"/><path d="M9 29v-5M6 24h6l-1.5-4.5h-3z"/><path d="M19 34V17q0-5 5-5h16q5 0 5 5V34"/><rect class="f" x="22" y="23" width="8" height="5" rx="2.5"/><rect class="f" x="34" y="23" width="8" height="5" rx="2.5"/><rect class="f" x="17" y="27" width="30" height="11" rx="2"/><path d="M17 31.5h30M19 38v4M45 38v4"/><rect x="50" y="29" width="10" height="10" rx="1.2"/><path d="M50 34h10M53.5 32h3M51.5 39v3M58.5 39v3"/><path d="M55 29v-5M52 24h6l-1.5-4.5h-3z"/>',
  baza: '<rect x="4" y="24" width="40" height="12" rx="2"/><path d="M5 21l37-8 1 4-37 8z"/><path d="M9 30h30M7 36v3M41 36v3"/>',
  yatak: '<rect x="3" y="22" width="42" height="18" rx="5"/><path d="M3 28h42"/><circle class="d" cx="10" cy="34" r="1.4"/><circle class="d" cx="19.3" cy="34" r="1.4"/><circle class="d" cx="28.7" cy="34" r="1.4"/><circle class="d" cx="38" cy="34" r="1.4"/>',
  baslik: '<path d="M7 35V15q0-3 3-4q22-7 44 0q3 1 3 4v20z"/><path class="t" d="M11 33V16.5q0-1.5 1.5-2q19.5-6 39 0q1.5.5 1.5 2V33z"/><path class="t" d="M14 25l6-6 6 6 6-6 6 6 6-6 6 6M14 25l6 6 6-6 6 6 6-6 6 6 6-6"/><circle class="d" cx="20" cy="19" r="1.3"/><circle class="d" cx="32" cy="19" r="1.3"/><circle class="d" cx="44" cy="19" r="1.3"/><circle class="d" cx="14" cy="25" r="1.3"/><circle class="d" cx="26" cy="25" r="1.3"/><circle class="d" cx="38" cy="25" r="1.3"/><circle class="d" cx="50" cy="25" r="1.3"/><circle class="d" cx="20" cy="31" r="1.3"/><circle class="d" cx="32" cy="31" r="1.3"/><circle class="d" cx="44" cy="31" r="1.3"/><path d="M12 35v7M52 35v7"/>',
  kose: '<path d="M5 6h13v24h25v12H5z"/><path d="M10 6v31h33M10 18h8M30 30v7"/>',
  masa: '<rect x="3" y="17" width="58" height="4.5" rx="1.2"/><path d="M8 21.5V42M56 21.5V42M8 26h48"/>',
  sandalye: '<path d="M15 25V10q0-5 5-5h8q5 0 5 5v15"/><path d="M19 11h10"/><rect class="f" x="11" y="24" width="26" height="6" rx="2"/><path d="M14 30l-1 12M34 30l1 12"/>',
  konsol: '<rect x="6" y="14" width="52" height="3.5" rx="1"/><rect x="8" y="17.5" width="48" height="12" rx="1"/><path d="M24 17.5v12M40 17.5v12M10.5 29.5l-1 12.5M53.5 29.5l1 12.5"/><circle class="d" cx="16" cy="23.5" r="1.3"/><circle class="d" cx="32" cy="23.5" r="1.3"/><circle class="d" cx="48" cy="23.5" r="1.3"/>',
  tv: '<path d="M7 26v-5q1.5-3.5 3 0v5"/><rect x="33" y="20" width="3" height="6"/><rect x="36.5" y="21.5" width="3" height="4.5"/><rect x="2" y="26" width="44" height="12" rx="1.5"/><path d="M16.5 26v12M31.5 26v12M16.5 32h15M5 38v4M43 38v4"/><circle class="d" cx="13.5" cy="32" r="1.3"/><circle class="d" cx="34.5" cy="32" r="1.3"/>',
  nakliye: '<path d="M3 15h24v20H3z"/><path d="M27 21h9l7 8v6H27z"/><path d="M30 24h5l4 5h-9z"/><circle class="f" cx="11" cy="37" r="4"/><circle class="f" cx="35" cy="37" r="4"/>',
  taksit: '<rect x="4" y="12" width="40" height="28" rx="4"/><path d="M4 19h40M9 33h8"/><circle cx="29" cy="26" r="2"/><circle cx="38" cy="34" r="2"/><path d="M39 25l-11 10"/>',
  hediye: '<rect x="6" y="19" width="36" height="8" rx="1.5"/><path d="M9 27v15h30V27M24 19v23"/><path d="M24 19c-3-8-12-9-12-4 0 3 6 4 12 4zM24 19c3-8 12-9 12-4 0 3-6 4-12 4z"/>',
};
// Hepsi aynı 64x48 alanda çizilir; 48 genişliğindeki simgeler ortalanır.
const WIDE = ['koltuk', 'yatakodasi', 'masa', 'konsol', 'baslik'];
const iconHtml = e => `<svg class="ic" viewBox="${WIDE.includes(e) ? '0' : '-8'} 0 64 48" aria-hidden="true">${ICONS[e] || ''}</svg>`;

const PRODUCTS = [
  ['koltuk', 'Koltuk'], ['yatakodasi', 'Yatak odası'],
  ['baza', 'Baza'], ['yatak', 'Yatak'], ['baslik', 'Başlık'], ['kose', 'Köşe takımı'],
  ['masa', 'Yemek masası'], ['sandalye', 'Sandalye'], ['konsol', 'Konsol'],
  ['tv', 'TV ünitesi'],
].map(([id, n]) => ({ id, n }));
// ek masraflar: sepette ürünlerle aynı görünür (adet + fiyat)
const EXTRAS = [['nakliye', 'Nakliye + Kurulum'], ['taksit', 'Taksit farkı'], ['hediye', 'Hediye']].map(([id, n]) => ({ id, n }));
const nameOf = id => (PRODUCTS.find(p => p.id === id) || EXTRAS.find(p => p.id === id) || {}).n || '';
const isProduct = id => PRODUCTS.some(p => p.id === id);

const LS = 'fiyatHesabi.v7';
const LS_HIDE = 'fiyatHesabi.gizli';
let hidden = localStorage.getItem(LS_HIDE) === '1';
const EYE_OPEN = '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF = '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>';
const uid = () => Math.random().toString(36).slice(2, 9);
// her satır: { id, pid, p: fiyat, q: adet }. Nakliye her ürün için ayrı satır olarak eklenebilir.
const newCart = () => ({ lines: [] });
let C = load();
function load() {
  try { const c = JSON.parse(localStorage.getItem(LS)); if (c && c.lines) return c; } catch (e) {}
  return newCart();
}
function save() { localStorage.setItem(LS, JSON.stringify(C)); }

const $ = id => document.getElementById(id);
const app = $('app');
const num = n => Math.round(n).toLocaleString('tr-TR');
const fmt = n => num(n) + ' ₺';
const parseTL = s => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
const qtyOf = pid => C.lines.filter(l => l.pid === pid).reduce((a, l) => a + l.q, 0);
const lineById = id => C.lines.find(l => l.id === id);

let undoCart = null;
function toastUndo(t) { const el = $('toast'); el.innerHTML = `${t} <button class="undo" data-act="undo">Geri al</button>`; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => { el.classList.remove('show'); undoCart = null; }, 5000); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1600); }

/* ---------- hesap ---------- */
const total = () => C.lines.reduce((a, l) => a + l.p * l.q, 0);

const priceBox = (id, v) =>
  `<label class="pr ${v ? '' : 'miss'}" id="pr-${id}"><input inputmode="numeric" data-k="lp" data-id="${id}" value="${v ? num(v) : ''}"><span>₺</span></label>`;
const ltText = l => `${l.q} × ${num(l.p)} = ${fmt(l.p * l.q)}`;

function lineHtml(l, owner) {
  return `<div class="line" data-id="${l.id}">
    <div class="lt"><button class="x" data-act="del" data-id="${l.id}" aria-label="Sil">✕</button>${iconHtml(l.pid)}<span class="nm">${nameOf(l.pid)}${owner ? ` <small class="own">(${owner})</small>` : ''}</span><span class="grip" aria-label="Tut ve sürükle"><svg viewBox="0 0 12 20"><circle cx="3" cy="4" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/><circle cx="3" cy="16" r="1.6"/><circle cx="9" cy="16" r="1.6"/></svg></span></div>
    <div class="lb">
      <div class="step"><button data-act="dec" data-id="${l.id}">−</button><b>${l.q}</b><button data-act="inc" data-id="${l.id}">+</button></div>
      ${priceBox(l.id, l.p)}
    </div>
    ${l.q > 1 ? `<div class="ltot" id="lt-${l.id}">${ltText(l)}</div>` : ''}
  </div>`;
}

function render() {
  // − adet + her simgede hep hazır durur; dec: eksiltme eylemi, inc: ekleme eylemi
  const tile = (inc, dec, id, n, count) => `<div class="tile ${count ? 'on' : ''}">
      <button class="tmain" data-act="${inc}" data-id="${id}">${iconHtml(id)}<span class="nm">${n}</span></button>
      <div class="tstep"><button data-act="${dec}" data-id="${id}" ${count ? '' : 'disabled'} aria-label="Eksilt">−</button><b>${count}</b><button data-act="${inc}" data-id="${id}" aria-label="Ekle">+</button></div>
    </div>`;
  let owner = '';  // nakliyenin yanında, kendinden önce eklenen ürünün adı yazar
  const body = C.lines.map(l => {
    if (l.pid === 'nakliye') return lineHtml(l, owner);
    if (isProduct(l.pid)) owner = nameOf(l.pid);
    return lineHtml(l);
  }).join('');
  app.innerHTML = `
    <h2>Ürüne dokun, sepete eklensin</h2>
    <div class="grid">${PRODUCTS.map(p => tile('add', 'pdec', p.id, p.n, qtyOf(p.id))).join('')}</div>
    <h2>Ek masraflar — unutma!</h2>
    <div class="grid">
      ${tile('nakadd', 'nakpop', 'nakliye', 'Nakliye + Kurulum', qtyOf('nakliye'))}
      ${tile('add', 'pdec', 'taksit', 'Taksit farkı', qtyOf('taksit'))}
      ${tile('add', 'pdec', 'hediye', 'Hediye<br><small>Orta / Zigon sehpa</small>', qtyOf('hediye'))}
    </div>
    <h2>Sepet</h2>
    ${C.lines.length > 1 ? '<p class="hint">Sırayı değiştirmek için sağdaki noktalardan tut ve sürükle.</p>' : ''}
    <div class="card cart">${body || '<p class="empty">Henüz ürün yok. Yukarıdaki simgelere dokun.</p>'}</div>
    ${body ? '<button class="clear" data-act="clear">🗑️ Sepeti temizle</button>' : ''}
    <p class="ver">Sürüm ${APP_VERSION}</p>`;
  renderTotal();
}
function renderTotal() { $('bt').textContent = hidden ? '••••••' : fmt(total()); }
function renderEye() { document.body.classList.toggle('gizli', hidden); $('eye').querySelector('svg').innerHTML = hidden ? EYE_OFF : EYE_OPEN; }
function rerenderKeepScroll() { const y = scrollY; render(); scrollTo(0, y); }

/* ---------- olaylar ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'eye': hidden = !hidden; localStorage.setItem(LS_HIDE, hidden ? '1' : '0'); renderEye(); renderTotal(); return;
    case 'add': {
      const l = C.lines.find(x => x.pid === id);
      if (l) l.q++; else C.lines.push({ id: uid(), pid: id, p: 0, q: 1 });
      navigator.vibrate?.(10);
      toast(`${nameOf(id)} eklendi`);
      break;
    }
    case 'nakadd': C.lines.push({ id: uid(), pid: 'nakliye', p: 0, q: 1 }); toast('Nakliye + Kurulum eklendi'); break;
    case 'nakpop': { const l = C.lines.filter(x => x.pid === 'nakliye').pop(); if (!l) return; l.q--; if (l.q < 1) C.lines = C.lines.filter(x => x !== l); break; }
    case 'pdec': { const l = C.lines.find(x => x.pid === id); if (!l) return; l.q--; if (l.q < 1) C.lines = C.lines.filter(x => x !== l); break; }
    case 'inc': lineById(id).q++; break;
    case 'dec': { const l = lineById(id); l.q--; if (l.q < 1) C.lines = C.lines.filter(x => x !== l); break; }
    case 'del': C.lines = C.lines.filter(x => x.id !== id); break;
    // onay penceresi yok: tek dokunuşta sıfırlanır, yanlışlıkla basılırsa 5 sn içinde geri alınabilir
    case 'clear': undoCart = C; C = newCart(); toastUndo('Sepet temizlendi'); break;
    case 'undo': if (!undoCart) return; C = undoCart; undoCart = null; $('toast').classList.remove('show'); break;
  }
  save(); rerenderKeepScroll();
});

document.addEventListener('input', e => {
  const t = e.target; if (t.dataset.k !== 'lp') return;
  const n = parseTL(t.value);
  t.value = n ? num(n) : '';
  $('pr-' + t.dataset.id)?.classList.toggle('miss', !n);
  const l = lineById(t.dataset.id); l.p = n;
  const lt = $('lt-' + l.id); if (lt) lt.textContent = ltText(l);
  save(); renderTotal();
});
/* ---------- sepette tut-sürükle ile sıralama ---------- */
// Tutulan satır havaya kalkar ve parmağı takip eder; diğer satırlar kayarak ona yer açar.
// Bırakınca satır yeni yerine yumuşakça oturur. Kenara gelince sayfa kendiliğinden kayar.
let drag = null;
const docY = clientY => clientY + scrollY;

document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g || drag) return;
  e.preventDefault();
  const line = g.closest('.line'), list = line.parentElement;
  const items = [...list.querySelectorAll('.line')].map(el => {
    const r = el.getBoundingClientRect();
    return { el, top: docY(r.top), h: el.offsetHeight };
  });
  const i0 = items.findIndex(it => it.el === line);
  drag = { line, items, i0, t: i0, startY: docY(e.clientY), y: e.clientY, h: items[i0].h };
  g.setPointerCapture?.(e.pointerId);
  items.forEach(it => { if (it.el !== line) it.el.classList.add('shifting'); });
  line.classList.add('dragging'); document.body.classList.add('dragmode');
  line.style.transform = 'translateY(0) scale(1.03)';
  navigator.vibrate?.(15);
  requestAnimationFrame(autoScroll);
});
document.addEventListener('pointermove', e => { if (!drag || drag.dropping) return; drag.y = e.clientY; follow(); });

function follow() {
  const { line, items, i0, h } = drag;
  const dy = docY(drag.y) - drag.startY;
  line.style.transform = `translateY(${dy}px) scale(1.03)`;
  // tutulan satırın ortası hangi satırların ortasını geçti?
  const c = items[i0].top + h / 2 + dy;
  let t = 0;
  items.forEach((it, k) => { if (k !== i0 && it.top + it.h / 2 < c) t++; });
  if (t !== drag.t) { drag.t = t; navigator.vibrate?.(8); }
  items.forEach((it, k) => {
    if (k === i0) return;
    let shift = 0;
    if (k > i0 && k <= t) shift = -h;
    if (k < i0 && k >= t) shift = h;
    it.el.style.transform = shift ? `translateY(${shift}px)` : '';
  });
}
function autoScroll() {
  if (!drag || drag.dropping) return;
  const edge = 90, bottom = innerHeight - 110;  // altta toplam çubuğu var
  if (drag.y < edge) { scrollBy(0, -Math.ceil((edge - drag.y) / 6)); follow(); }
  else if (drag.y > bottom) { scrollBy(0, Math.ceil((drag.y - bottom) / 6)); follow(); }
  requestAnimationFrame(autoScroll);
}
function endDrag() {
  if (!drag || drag.dropping) return;
  const { line, items, i0, t } = drag;
  drag.dropping = true;
  // yeni yerine oturma mesafesi
  let target = 0;
  if (t > i0) for (let k = i0 + 1; k <= t; k++) target += items[k].h;
  if (t < i0) for (let k = t; k < i0; k++) target -= items[k].h;
  line.classList.add('dropping');
  line.style.transform = `translateY(${target}px) scale(1)`;
  setTimeout(() => {
    const [moved] = C.lines.splice(i0, 1);
    C.lines.splice(t, 0, moved);
    document.body.classList.remove('dragmode');
    drag = null;
    save(); rerenderKeepScroll();
  }, 220);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// Kutuya yazarken alttaki toplam klavyenin önünü kapatmasın
document.addEventListener('focusin', e => { if (e.target.matches('input')) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => document.body.classList.remove('typing'));
document.addEventListener('touchstart', () => {}, { passive: true }); // iOS'ta :active çalışsın

/* ---------- kendini güncelleme ----------
   Telefon ya da GitHub eski sürümü saklasa bile: açılışta ve uygulamaya her dönüşte
   sitedeki sürüm numarasına bakılır; farklıysa sayfa yeni sürümle yeniden yüklenir.
   Her yayında APP_VERSION değiştirilmeli. */
const APP_VERSION = '2026.11.26-2345';
async function checkUpdate() {
  try {
    const r = await fetch('./?nocache=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) location.replace('./?v=' + m[1]);
  } catch (e) { /* internet yoksa eski sürümle devam */ }
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

renderEye();
render();
</script>
